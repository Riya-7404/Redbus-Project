# ==============================
# Application
# ==============================
spring.application.name=Redbus

# ==============================
# MySQL Database
# Local: neeche wale default use honge (root/root)
# Render: DB_URL, DB_USER, DB_PASSWORD environment variables se override honge
# ==============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aabb419MVC?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Thymeleaf
# ==============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ==============================
# Server
# ==============================
server.port=${PORT:8080}
